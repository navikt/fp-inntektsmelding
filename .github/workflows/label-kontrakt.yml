name: "Label kontrakt-PRer"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'kontrakter/**'

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh label create kontrakt --repo "$GITHUB_REPOSITORY" --color 0e8a16 \
            --description "Endrer kontrakter/" 2>/dev/null || true
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label kontrakt
